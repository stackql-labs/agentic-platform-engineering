# Inactive teaching example only. The fixture runner is not connected to this
# cluster, authenticated approval is not implemented, and this CronJob must not
# be activated as evidence of a live agent deployment.
#
# Build from the repository root: docker build -f "10-26 Cloud Native AI Summit APAC/demo/agent/Dockerfile" -t platform-agent:dev .
# Do not apply this manifest until a live cluster adapter, authenticated approval,
# RBAC, audit retention, and isolated environment are reviewed and tested.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-agent
  namespace: shop
  labels:
    purpose: agentic-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-agent
  namespace: shop
  labels:
    purpose: agentic-demo
rules:
  # Read-only example permission set. The fixture agent does not currently use it.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-agent
  namespace: shop
  labels:
    purpose: agentic-demo
subjects:
  - kind: ServiceAccount
    name: platform-agent
    namespace: shop
roleRef:
  kind: Role
  name: platform-agent
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: platform-agent
  namespace: shop
  labels:
    purpose: agentic-demo
spec:
  suspend: true
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: platform-agent
            purpose: agentic-demo
        spec:
          serviceAccountName: platform-agent
          restartPolicy: Never
          containers:
            - name: agent
              image: platform-agent:dev
              imagePullPolicy: IfNotPresent
              env:
                - name: DEMO_POLICY_MODE
                  value: read_only
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { memory: 512Mi }
