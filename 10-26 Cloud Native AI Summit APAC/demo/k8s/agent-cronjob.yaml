# The agent as a workload. Everything the talk says the platform team owns is in
# this file and nowhere else:
#   schedule            -> the CronJob
#   identity            -> the ServiceAccount; the Role is the blast radius
#   tool surface        -> STACKQL_MCP_MODE on the agent container
#   credentials         -> a Secret, mounted into the process, never into the model
#   observability       -> the audit log on a shared volume
#
# The kubectl proxy sidecar is how the k8s provider reaches the API server from
# inside the pod: it authenticates with the pod's ServiceAccount token and listens
# on localhost:8001, so the agent's cluster_addr is the same in-cluster as it is
# on a laptop. It is a native sidecar (initContainer with restartPolicy: Always,
# Kubernetes 1.29+), so it is stopped when the agent container exits and the Job
# completes.
#
# Build the image first: docker build -t platform-agent:dev agent/  then
# kind load docker-image platform-agent:dev --name platform-demo
# Apply: kubectl apply -f k8s/agent-cronjob.yaml
# Run once now: kubectl -n shop create job --from=cronjob/platform-agent platform-agent-now
# Logs: kubectl -n shop logs job/platform-agent-now -c agent -f
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-agent
  namespace: shop
  labels:
    purpose: agentic-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-agent
  namespace: shop
  labels:
    purpose: agentic-demo
rules:
  # read the estate: what the agent needs to diagnose, nothing else
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  # the one write the gated path may perform. Remove this rule and a `safe` mode
  # approval still cannot change anything: the Role is the outer boundary.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-agent
  namespace: shop
  labels:
    purpose: agentic-demo
subjects:
  - kind: ServiceAccount
    name: platform-agent
    namespace: shop
roleRef:
  kind: Role
  name: platform-agent
  apiGroup: rbac.authorization.k8s.io
---
# kubectl create secret generic platform-agent -n shop --from-literal=ANTHROPIC_API_KEY=sk-ant-...
# is the better way; this stanza is here so the shape is visible on a slide.
apiVersion: v1
kind: Secret
metadata:
  name: platform-agent
  namespace: shop
  labels:
    purpose: agentic-demo
type: Opaque
stringData:
  ANTHROPIC_API_KEY: replace-me
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: platform-agent
  namespace: shop
  labels:
    purpose: agentic-demo
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: platform-agent
            purpose: agentic-demo
        spec:
          serviceAccountName: platform-agent
          restartPolicy: Never
          initContainers:
            # native sidecar: starts before the agent, stays up while it runs,
            # is stopped when it exits
            - name: kube-proxy
              # bitnami/kubectl moved to a frozen bitnamilegacy namespace in 2025; alpine/k8s
              # tracks Kubernetes minor versions and ships kubectl. Match your cluster version.
              image: alpine/k8s:1.34.12
              command: ["kubectl", "proxy", "--port=8001", "--address=127.0.0.1"]
              restartPolicy: Always
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 64Mi }
          containers:
            - name: agent
              image: platform-agent:dev
              imagePullPolicy: IfNotPresent
              env:
                - name: STACKQL_MCP_MODE
                  value: read_only            # the platform's decision, in the Pod spec
                - name: KUBE_CLUSTER_ADDR
                  value: localhost:8001
                - name: KUBE_PROTOCOL
                  value: http
                - name: K8S_NAMESPACE
                  value: shop
                - name: ANTHROPIC_MODEL
                  value: claude-opus-5-5
                - name: ANTHROPIC_EFFORT
                  value: medium
                - name: STACKQL_APPROOT
                  value: /stackql
                - name: STACKQL_AUDIT_DIR
                  value: /audit
                - name: ANTHROPIC_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: platform-agent
                      key: ANTHROPIC_API_KEY
              volumeMounts:
                - name: audit
                  mountPath: /audit
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { memory: 512Mi }
          volumes:
            - name: audit
              emptyDir: {}
